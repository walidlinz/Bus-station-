<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<title>بيانات سائقي الباص</title>
<style>
  :root{
    color-scheme: light dark;

    --bg:#eef2f9;
    --glow-1:rgba(21,101,216,.10);
    --glow-2:rgba(14,159,110,.10);
    --card:#ffffff;
    --text:#0d1526;
    --muted:#5c6b83;
    --line:#e3e9f3;
    --accent:#1565d8;
    --accent-soft:#e8f0fd;
    --call:#0b8f63;
    --call-hover:#0a7d57;
    --call-text:#ffffff;
    --shadow:0 10px 28px rgba(15,35,70,.10);

    --radius:18px;
  }

  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1220;
      --glow-1:rgba(106,168,255,.14);
      --glow-2:rgba(45,212,167,.10);
      --card:#141d2e;
      --text:#eaf0fa;
      --muted:#96a6bf;
      --line:#22304a;
      --accent:#6aa8ff;
      --accent-soft:#1b2a44;
      --call:#1fbe8d;
      --call-hover:#25d3a0;
      --call-text:#04231a;
      --shadow:0 10px 28px rgba(0,0,0,.45);
    }
  }

  *{box-sizing:border-box}

  html{
    -webkit-text-size-adjust:100%;
    scroll-behavior:smooth;
  }

  body{
    margin:0;
    min-height:100dvh;
    padding:calc(22px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    font-family:"Segoe UI","Noto Sans Arabic","Dubai","Geeza Pro",Tahoma,"Helvetica Neue",Arial,sans-serif;
    font-size:18px;
    line-height:1.6;
    color:var(--text);
    background:
      radial-gradient(680px 380px at 92% -8%, var(--glow-1), transparent 70%),
      radial-gradient(620px 380px at 4% 104%, var(--glow-2), transparent 70%),
      var(--bg);
    background-attachment:fixed;
  }

  .wrap{
    width:100%;
    max-width:560px;
    margin:0 auto;
  }

  /* ---------- الترويسة ---------- */
  header{
    text-align:center;
    padding:8px 4px 26px;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    margin-bottom:14px;
    padding:5px 14px;
    border-radius:999px;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.82rem;
    font-weight:700;
    letter-spacing:.2px;
  }

  .badge svg{width:17px;height:17px}

  h1{
    margin:0;
    font-size:clamp(1.75rem, 8vw, 2.35rem);
    line-height:1.3;
    font-weight:800;
    letter-spacing:-.4px;
  }

  .rule{
    width:74px;
    height:5px;
    margin:16px auto 0;
    border-radius:999px;
    background:linear-gradient(90deg, var(--accent), var(--call));
  }

  /* ---------- الأقسام ---------- */
  section{margin-top:30px}
  section:first-of-type{margin-top:6px}

  .sec-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 12px;
  }

  .sec-head h2{
    margin:0;
    font-size:1.3rem;
    font-weight:800;
    letter-spacing:-.2px;
  }

  .bar{
    width:6px;
    height:26px;
    border-radius:999px;
    background:var(--accent);
    flex:0 0 auto;
  }

  .evening .bar{background:var(--call)}

  .meta{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px 10px;
    margin:0 0 16px;
    padding-inline-start:16px;
    color:var(--muted);
    font-size:.95rem;
    line-height:1.9;
  }

  .dot{opacity:.55}

  /* ---------- البطاقات ---------- */
  .card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:14px;
    padding:16px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--card);
    box-shadow:var(--shadow);
  }

  .who{
    display:flex;
    align-items:center;
    gap:13px;
    min-width:0;
  }

  .avatar{
    flex:0 0 auto;
    display:grid;
    place-items:center;
    width:50px;
    height:50px;
    border-radius:14px;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:1.45rem;
    font-weight:800;
    line-height:1;
  }

  .evening .avatar{color:var(--call)}

  .info{min-width:0}

  .name{
    margin:0 0 3px;
    font-size:1.25rem;
    font-weight:800;
    line-height:1.35;
    overflow-wrap:anywhere;
  }

  .num{
    display:inline-block;
    direction:ltr;
    unicode-bidi:isolate;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
    letter-spacing:.6px;
    color:var(--muted);
    font-size:1.05rem;
    font-weight:600;
  }

  /* ---------- زر الاتصال ---------- */
  .call{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    min-height:48px;
    padding:0 18px;
    border-radius:14px;
    background:var(--call);
    color:var(--call-text);
    font-family:inherit;
    font-size:1rem;
    font-weight:800;
    text-decoration:none;
    -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease, background-color .2s ease;
  }

  .call:hover{background:var(--call-hover)}
  .call:active{transform:scale(.96)}

  .call:focus-visible{
    outline:3px solid var(--accent);
    outline-offset:3px;
  }

  .call svg{
    width:19px;
    height:19px;
    flex:0 0 auto;
  }

  /* ---------- العناصر النائبة القابلة للتعديل ---------- */
  .fill{
    display:inline-block;
    padding:0 8px;
    border:1px dashed currentColor;
    border-radius:8px;
    color:var(--accent);
    font-weight:700;
    font-size:.92em;
    opacity:.95;
  }

  footer{
    margin-top:30px;
    padding-top:18px;
    border-top:1px solid var(--line);
    text-align:center;
    color:var(--muted);
    font-size:.88rem;
    line-height:1.8;
  }

  @media (max-width:360px){
    body{font-size:17px;padding-inline:12px}
    .card{padding:14px;gap:10px}
    .avatar{width:44px;height:44px;font-size:1.25rem}
    .call{padding:0 14px;font-size:.95rem}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important; animation:none !important}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="badge">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 5h18v11H3z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M3 11h18M7 16v3m10-3v3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="7" cy="8" r="1.1" fill="currentColor"/><circle cx="17" cy="8" r="1.1" fill="currentColor"/></svg>
      <span>دليل التواصل</span>
    </div>
    <h1>بيانات سائقي الباص</h1>
    <div class="rule"></div>
  </header>

  <!-- ⬇️ للتعديل: ابحث في هذا الملف عن [الوقت] و [الأيام] واستبدلها ببياناتك الحقيقية -->

  <section class="morning">
    <div class="sec-head">
      <span class="bar" aria-hidden="true"></span>
      <h2>الفترة الصباحية</h2>
    </div>

    <p class="meta">
      <span>من <span class="fill">[الوقت]</span> إلى <span class="fill">[الوقت]</span></span>
      <span class="dot" aria-hidden="true">•</span>
      <span>أيام العمل: <span class="fill">[الأيام]</span></span>
    </p>

    <article class="card">
      <div class="who">
        <div class="avatar" aria-hidden="true">م</div>
        <div class="info">
          <h3 class="name">محمود</h3>
          <span class="num" dir="ltr">55029669</span>
        </div>
      </div>
      <a class="call" href="tel:55029669" aria-label="اتصال بمحمود على الرقم 55029669">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.28 1.2.4 2.5.6 3.8.6.6 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.75 21 3 13.25 3 3.7c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.28 1.1z" fill="currentColor"/></svg>
        <span>اتصال</span>
      </a>
    </article>

    <article class="card">
      <div class="who">
        <div class="avatar" aria-hidden="true">أ</div>
        <div class="info">
          <h3 class="name">انكوش</h3>
          <span class="num" dir="ltr">+918968269369</span>
        </div>
      </div>
      <a class="call" href="tel:+918968269369" aria-label="اتصال بانكوش على الرقم +918968269369">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.28 1.2.4 2.5.6 3.8.6.6 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.75 21 3 13.25 3 3.7c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.28 1.1z" fill="currentColor"/></svg>
        <span>اتصال</span>
      </a>
    </article>
  </section>

  <section class="evening">
    <div class="sec-head">
      <span class="bar" aria-hidden="true"></span>
      <h2>الفترة المسائية</h2>
    </div>

    <p class="meta">
      <span>من <span class="fill">[الوقت]</span> إلى <span class="fill">[الوقت]</span></span>
      <span class="dot" aria-hidden="true">•</span>
      <span>أيام العمل: <span class="fill">[الأيام]</span></span>
    </p>

    <article class="card">
      <div class="who">
        <div class="avatar" aria-hidden="true">ح</div>
        <div class="info">
          <h3 class="name">حسام</h3>
          <span class="num" dir="ltr">97962844</span>
        </div>
      </div>
      <a class="call" href="tel:97962844" aria-label="اتصال بحسام على الرقم 97962844">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.28 1.2.4 2.5.6 3.8.6.6 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.75 21 3 13.25 3 3.7c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.28 1.1z" fill="currentColor"/></svg>
        <span>اتصال</span>
      </a>
    </article>
  </section>

  <footer>
    اضغط على زر «اتصال» للتواصل المباشر مع السائق.
  </footer>

</div>

</body>
